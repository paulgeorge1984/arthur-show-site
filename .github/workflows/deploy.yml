name: XServer FTPS connection test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_ftps:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify scoped FTPS upload and download
        env:
          XSERVER_FTP_USERNAME: ${{ secrets.XSERVER_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${XSERVER_FTP_USERNAME:?XServer FTP username is missing}"
          : "${LFTP_PASSWORD:?XServer FTP password is missing}"
          if [[ ! "$XSERVER_FTP_USERNAME" =~ ^[a-z0-9._-]+@arthur-show[.]com$ ]]; then
            echo 'Unexpected FTP account; refusing to test.' >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y lftp
          printf 'Arthur Show XServer FTPS test 2026-10-27\n' > "$RUNNER_TEMP/xserver-ftps-probe-20261027.txt"
          lftp --norc <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ftp:ssl-protect-list yes
          set ssl:verify-certificate yes
          set xfer:use-temp-file yes
          set net:max-retries 2
          set net:timeout 20
          open --env-password --user "$XSERVER_FTP_USERNAME" ftp://sv17295.xserver.jp
          put "$RUNNER_TEMP/xserver-ftps-probe-20261027.txt" -o ".xserver-ftps-probe-20261027.txt"
          get ".xserver-ftps-probe-20261027.txt" -o "$RUNNER_TEMP/xserver-ftps-probe-return.txt"
          bye
          LFTP
          cmp "$RUNNER_TEMP/xserver-ftps-probe-20261027.txt" "$RUNNER_TEMP/xserver-ftps-probe-return.txt"
          echo 'FTPS upload and download comparison passed.'
