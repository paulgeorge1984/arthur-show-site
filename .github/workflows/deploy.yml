name: Onamae public reachability test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public_reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check existing site from GitHub runner
        run: |
          set -uo pipefail
          failed=0
          for url in \
            "http://arthur-show.com/.well-known/acme-challenge/YE2jkv5yxJjdvXy8Oqfl_MDfITP4EiokyrLDdfFQJ7E" \
            "http://www.arthur-show.com/.well-known/acme-challenge/Y0zAsVtJgnBPGl9mVdXjmZKJPKf-MLQ3M61JjAuAdFE"; do
            if status=$(curl -4 --noproxy '*' --connect-timeout 8 --max-time 12 -sS -o /dev/null -w '%{http_code}' "$url"); then
              echo "Public challenge response: $status"
              [[ "$status" == 200 ]] || failed=1
            else
              echo "Public challenge connection failed"
              failed=1
            fi
          done
          exit "$failed"
