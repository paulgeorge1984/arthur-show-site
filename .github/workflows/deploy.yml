name: Deploy Astro Site

on:
  push:
    branches: [ main ]
  schedule:
    # Check scheduled messages every 15 minutes, but deploy only when content just became publishable.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3

      - name: Check scheduled publish window
        id: publish_window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const path = require('path');
          const contentDir = path.join(process.cwd(), 'src/content/daily-messages');
          const now = new Date();
          // Scheduled GitHub Actions can start several hours late. Keep a full-day
          // recovery window, then check the live URL so each article deploys once.
          const windowStart = new Date(now.getTime() - 24 * 60 * 60 * 1000);
          let shouldDeploy = false;
          const candidates = [];

          for (const file of fs.readdirSync(contentDir)) {
            if (!file.endsWith('.mdx')) continue;
            const body = fs.readFileSync(path.join(contentDir, file), 'utf8');
            const match = body.match(/^date:\s*(.+)$/m);
            if (!match) continue;
            const publishDate = new Date(match[1].trim().replace(/^["']|["']$/g, ''));
            if (publishDate > windowStart && publishDate <= now) {
              candidates.push(file.replace(/\.mdx$/, ''));
            }
          }

          async function isAlreadyLive(slug) {
            const url = `https://arthur-show.com/messages/${encodeURIComponent(slug)}/`;
            try {
              const response = await fetch(url, {
                redirect: 'follow',
                signal: AbortSignal.timeout(10000),
                headers: { 'user-agent': 'arthur-show-scheduled-publish-check' },
              });
              response.body?.cancel();
              return response.ok;
            } catch (error) {
              console.error(`Could not verify ${url}: ${error.message}`);
              return false;
            }
          }

          (async () => {
            for (const slug of candidates) {
              if (!(await isAlreadyLive(slug))) {
                console.error(`Scheduled article is ready but not live: ${slug}`);
                shouldDeploy = true;
                break;
              }
            }
            console.log(`should_deploy=${shouldDeploy ? 'true' : 'false'}`);
          })().catch((error) => {
            console.error(error);
            console.log('should_deploy=true');
          });
          NODE

      - uses: actions/setup-node@v3
        if: steps.publish_window.outputs.should_deploy == 'true'
        with:
          node-version: 18
      - name: Install dependencies
        if: steps.publish_window.outputs.should_deploy == 'true'
        run: npm ci
      - name: Build site
        if: steps.publish_window.outputs.should_deploy == 'true'
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA_MEASUREMENT_ID }}
        run: npm run build
      - name: FTP Deploy
        if: steps.publish_window.outputs.should_deploy == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" <<EOF
          set ftp:ssl-allow no
          set net:max-retries 3
          set net:timeout 20
          mirror --reverse --verbose --parallel=4 ./dist/ "$FTP_REMOTE_DIR"/
          bye
          EOF
