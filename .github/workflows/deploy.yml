name: XServer FTP scope check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftp_scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check that FTP cannot leave the website directory
        env:
          XSERVER_FTP_USERNAME: ${{ secrets.XSERVER_FTP_USERNAME }}
          XSERVER_FTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}
        run: |
          python3 <<'PY'
          import ftplib, os, ssl, sys
          username=os.environ.get('XSERVER_FTP_USERNAME','')
          password=os.environ.get('XSERVER_FTP_PASSWORD','')
          if not username or not password:
              sys.exit('Missing FTP account configuration')
          try:
              with ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=15) as ftp:
                  ftp.connect('sv17295.xserver.jp',21)
                  ftp.login(username,password)
                  ftp.prot_p()
                  start=ftp.pwd()
                  try:
                      ftp.cwd('..')
                  except ftplib.error_perm:
                      pass
                  else:
                      if ftp.pwd()!=start:
                          sys.exit('Scope check failed: parent directory was accessible')
                  try:
                      ftp.cwd('/home/xs534416/vr360.life')
                  except ftplib.error_perm:
                      pass
                  else:
                      sys.exit('Scope check failed: another site directory was accessible')
                  print('PASS: FTP could not leave the configured website directory')
          except SystemExit:
              raise
          except Exception as error:
              sys.exit('Scope check could not complete: '+type(error).__name__)
          PY
