name: Sync event announcements to XServer migration copy
on:
  push:
    branches: [codex/sync-xserver-events-20261028]
    paths: [.github/workflows/sync-xserver-events.yml]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync only verified event files over FTPS
        env:
          FTP_USER: ${{ secrets.XSERVER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}
        run: |
          python3 <<'PY'
          import ftplib, hashlib, io, json, os, re, ssl, sys, urllib.request
          from pathlib import Path
          sys.excepthook = lambda kind, value, tb: print('Event sync failed: ' + kind.__name__, file=sys.stderr)
          ROWS = [{'path': '_astro/index.B2t--DfK.css', 'bytes': 7174, 'sha256': '1246c89d37038c9c90fa21e28ec46ec51a637b7711b39a4aa1a94ac86e07755d', 'old_sha256': '1246c89d37038c9c90fa21e28ec46ec51a637b7711b39a4aa1a94ac86e07755d'}, {'path': '_astro/index.BRxkACbW.css', 'bytes': 56436, 'sha256': '80edfbb58b1225407380d6a6f8bd930f5446bfe8f833289dc93025e622384955', 'old_sha256': None}, {'path': '_astro/index.CWu911yJ.css', 'bytes': 24412, 'sha256': '3a959e3ba5731db31891a92e7e4746fb84aa8983ff3589521e3c626788ea47d2', 'old_sha256': None}, {'path': '_astro/index.CZxofAC1.css', 'bytes': 12221, 'sha256': 'ca5a6c9370d43f1b98822864bc6cb207370fa575ec95f57129bbc9b0e4ef999e', 'old_sha256': 'ca5a6c9370d43f1b98822864bc6cb207370fa575ec95f57129bbc9b0e4ef999e'}, {'path': '_astro/index.Ht9Wmt5w.css', 'bytes': 7142, 'sha256': 'd780c5552601871883b16da85a57fbeede77e652a42f06ab5815f8667efeffd7', 'old_sha256': 'd780c5552601871883b16da85a57fbeede77e652a42f06ab5815f8667efeffd7'}, {'path': 'assets/kashiwa-passion-20261101.jpg', 'bytes': 482312, 'sha256': '27c57acbf9584960c860126381bec998cf72ef1d55cb8e12096d48c94914b632', 'old_sha256': None}, {'path': 'assets/saturday-night-arthur-20261107-touring.png', 'bytes': 1929978, 'sha256': 'a8035ee609589c98a0f445a0d941397ee55d642c6e2b574f47c1aa88c7b64216', 'old_sha256': None}, {'path': 'calendar/index.html', 'bytes': 110718, 'sha256': '254aca7e84c099692f68670080010490781af39446a9a326d77479b7c0331e46', 'old_sha256': '70da262c9f75a4f2af3076c2bdabb81f1a3cc5247c7f1c093d978427ec9bdd43'}, {'path': 'index.html', 'bytes': 1181416, 'sha256': '01eb5d6f7e8548e14c5d2b48ce11bcf61c91652101ce66e2a37f7e6f2a2c07d5', 'old_sha256': '60d91b2b33b551f37f4ab64ecd9fd771a373035dc437ab04fa1adf2020b30e7e'}]
          sha = lambda data: hashlib.sha256(data).hexdigest()
          local = {}
          for row in ROWS:
              with urllib.request.urlopen('https://arthur-show.com/' + row['path'], timeout=60) as response:
                  data = response.read()
              if sha(data) != row['sha256']:
                  raise SystemExit('Published content hash mismatch: ' + row['path'])
              local[row['path']] = data
          user = os.environ['FTP_USER']
          if not re.fullmatch(r'[a-z0-9._-]+@arthur-show[.]com', user) or not os.environ['FTP_PASSWORD']:
              raise SystemExit('Unexpected scoped FTP account')
          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=60)
          ftp.connect('sv17295.xserver.jp', 21)
          ftp.login(user, os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          ftp.cwd('/')
          def read(path):
              out = io.BytesIO()
              try:
                  ftp.retrbinary('RETR /' + path, out.write)
              except ftplib.error_perm as error:
                  if str(error).startswith('550'):
                      return None
                  raise
              return out.getvalue()
          changes = []
          for row in ROWS:
              path = row['path']
              current = read(path)
              digest = sha(current) if current is not None else None
              if digest == row['sha256']:
                  continue
              if digest != row['old_sha256']:
                  raise SystemExit('Unexpected pre-existing file; no uploads started: ' + path)
              if current is not None:
                  backup = Path('event-sync-backup') / path
                  backup.parent.mkdir(parents=True, exist_ok=True)
                  backup.write_bytes(current)
              changes.append(row)
          for row in sorted(changes, key=lambda r: (r['path'] == 'index.html', r['path'].endswith('.html'), r['path'])):
              path = row['path']
              current = read(path)
              if (sha(current) if current is not None else None) != row['old_sha256']:
                  raise SystemExit('Concurrent edit detected: ' + path)
              temporary = path + '.event-update-7ede6c4'
              ftp.storbinary('STOR /' + temporary, io.BytesIO(local[path]))
              if sha(read(temporary)) != row['sha256']:
                  raise SystemExit('Temporary upload verification failed')
              ftp.rename('/' + temporary, '/' + path)
              if sha(read(path)) != row['sha256']:
                  raise SystemExit('Final upload verification failed')
              print('VERIFIED ' + path, flush=True)
          verified = []
          for row in ROWS:
              if sha(read(row['path'])) != row['sha256']:
                  raise SystemExit('Final content mismatch')
              verified.append(row['path'])
          ftp.quit()
          result = {'uploaded': len(changes), 'verified_files': verified, 'tls_certificate_verified': True, 'source_commit': '7ede6c4', 'target': 'sv17295.xserver.jp scoped Arthur Show root', 'dns_changes': 0}
          Path('event-sync-result.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result), flush=True)
          PY
      - name: Keep prior pages and verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xserver-event-sync-evidence
          path: |
            event-sync-backup/
            event-sync-result.json
          retention-days: 30
